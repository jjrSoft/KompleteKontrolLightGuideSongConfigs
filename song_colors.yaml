# All comments beginning with a hash are ignored.

# `msb` and `pc` are raw MIDI values from 0 through 127. Hosts such as VSTLive
# often display programs one-based.

# VSTLive names MIDI note 60 as C3.
# If missing, middle C is assumed to be C4.
middleC: C3

# Optional one-based indexing for banks and programs. Default is false (zero-based).
oneBasedBanks: false
oneBasedPrograms: true
